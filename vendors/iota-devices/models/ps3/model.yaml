name: IOTA PS3
description: Battery-powered wireless pressure sensor for monitoring gas and liquid pressure, with configurable measurement ranges.
logo: ps3.png
deviceProfileIds:
  - id: iota_RFGroup1_1.0.4a_classA
motionIndicator: near_static
LoRaWANCertified: false
modelId: iota:ps3:1
protocolId:
  - iota:pressure:1
supportedBACnetModbus: false
sensors:
examples:
  iota:pressure:1:
    - measurement uplink 12 bytes (raw only)
    - measurement uplink 12 bytes (10 bar scale)
    - startup uplink 8 bytes
    - daily uplink 6 bytes provisional
    - fail decode uplink wrong FPort
    - fail decode uplink unsupported length
    - encode configuration 48 reports and 2 measurements
    - encode configuration 24 reports and 1 measurement
    - fail encode downlink unsupported reports per day
    - fail encode downlink unsupported measurements per value
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false
