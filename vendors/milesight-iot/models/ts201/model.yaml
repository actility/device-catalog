# Commercial name of the model
name: TS201 Cost-Effective Temperature Sensor
# Functional description of the product. Maximum 500 characters.
description: "Milesight TS201 Temperature Sensor is rugged with IP67 rating offering real-time alerts, while complying with EN12830 Standard and HACCP Requirements. It is specially designed for various application scenarios like cold chain, pharmaceutical, food processing and more."
# Logo of the device
logo: ts201.png
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://lora-alliance.org/wp-content/uploads/2020/10/LoRa_Alliance_Vendor_ID_for_QR_Code_02142022.pdf.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds:
  - id: msight_RFGroup1_1.0.3a_classA
  - id: msight_us915-22dBm_1.0.3a_classA
  - id: msight_cn470-19dBm_1.0.3a_classA
  - id: msight_au915-22dBm_1.0.3a_classA
  - id: msight_RFGroup4_1.0.3a_classA

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings.
# Maximum device TX Conducted output power in dBm.
maxTxPower:
# Minimum device TX Conducted output power in dBm.
minTxPower:
# Maximum device TX Radiated output power in dBm.
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'
# or 'random' (not known, changes over time).
motionIndicator:

# Is your device certified by the LoRa Alliance? Possible values: true, false.
LoRaWANCertified: false
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a model, it cannot be changed later
modelId: msight:ts201:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
# Be careful: Once you chose a protocolId, it cannot be changed later
protocolId:
  - msight:ts201:2
  - msight:ts201:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
# DataSheet URL (optional)
specificationURL: https://resource.milesight.com/milesight/iot/document/ts201-datasheet-en.pdf
# User Guide URL (optional)
userGuideURL: https://resource.milesight.com/milesight/iot/document/ts201-user-guide-en.pdf
# <sensor>:<unitId> Available sensors following Actility ontology: https://github.com/actility/device-catalog/blob/main/template/sample-vendor/drivers/ONTOLOGY.md
sensors:
  - temperature:Cel
# Driver examples
# A list of examples description that are compatible with this model
examples:
  msight:ts201:2:
    - "Downlink encode: alarm_release_enable"
    - "Uplink example for TS201-V2"
    - "Downlink encode: report_interval"
    - "Uplink coverage: device_response_result:channel_type, device_response_result:result, device_response_result:request:d2d_uplink_config:d2d_uplink_enable and 5 more"
    - "Uplink coverage: device_response_result:request:temperature_alarm_config:condition, device_response_result:request:temperature_alarm_config:threshold_max, device_response_result:request:temperature_alarm_config:threshold_min and 3 more"
    - "Uplink coverage: sensor_0_type, sensor_0_sn"
    - "Uplink coverage: retransmit_config:enable, retransmit_config:interval"
    - "Uplink coverage: humidity_calibration_settings:enable, humidity_calibration_settings:calibration_value"
    - "Uplink coverage: device_response_result:request:button_lock_config:power_button, device_response_result:request:button_lock_config:report_button, temperature_mutation_alarm_config:mutation and 4 more"
    - "Uplink coverage: device_response_result:request:retransmit_config:enable, device_response_result:request:retransmit_config:interval, resend_interval"
    - "Uplink coverage: ack_retry_times"
    - "Uplink coverage: collection_interval"
    - "Uplink coverage: d2d_key"
    - "Uplink coverage: report_interval"
    - "Uplink coverage: alarm_report_counts"
    - "Uplink coverage: ipso_version"
    - "Uplink coverage: hardware_version"
    - "Uplink coverage: firmware_version"
    - "Uplink coverage: device_status"
    - "Uplink coverage: sn"
    - "Uplink coverage: reset_event"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage: temperature_unit, reboot, report_status and 8 more"
    - "Uplink coverage (synthetic frame): lorawan_class, device_response_result:request:fetch_sensor_id, d2d_uplink_config:d2d_uplink_enable and 3 more"
    - "Uplink coverage (synthetic frame): device_response_result:request:d2d_enable, temperature_alarm_config:enable, temperature_alarm_config:condition and 2 more"
    - "Uplink coverage: device_response_result:request:led_indicator_enable"
    - "Uplink coverage: device_response_result:request:query_config:temperature_unit"
    - "Uplink coverage: device_response_result:request:resend_interval"
    - "Uplink coverage: device_response_result:request:ack_retry_times"
    - "Downlink encode: linked group fetch_history (2 points)"
    - "Downlink encode: linked group humidity_alarm_config (2 points)"
    - "Downlink encode: linked group d2d_uplink_config (4 points)"
    - "Downlink encode: linked group button_lock_config (2 points)"
    - "Downlink write: report_status and 2 more"
    - "Downlink write: reboot"
    - "Downlink write: sync_time"
    - "Downlink write: alarm_report_counts and 2 more"
    - "Downlink write: clear_history"
    - "Downlink write: stop_transmit"
    - "Downlink write: fetch_sensor_id and 4 more"
    - "Downlink encode: temperature_mutation_alarm_config:enable and 1 more"
  msight:ts201:1:
    - "Downlink encode: alarm_release_enable"
    - "uplink containing only temperature"
    - "uplink containing temperature, event of temperature and temperature alarm"
    - "uplink containing temperature, event of temperature, temperature alarm and temperature mutation"
    - "uplink containing only event of temperature error"
    - "uplink containing history of event type, read status, temperature and timestamp"
    - "Downlink encode: report_interval"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false