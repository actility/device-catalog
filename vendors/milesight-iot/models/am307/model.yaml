# Commercial name of the model
name: AM307-LoRaWAN Indoor Air Quality Sensor (7 in 1)
# Functional description of the product. Maximum 500 characters.
description: "Milesight AM307 collects various indoor ambience conditions through 7 built-in sensors and delivers the data to the mobile App and its 4.2-inch E-ink screen. It supports batteries or DC power supply and can be easily equipped via NFC. It features a tri-color LED indicator, anti-theft design, and emoticon indication. AM307 is widely used for offices, stores, classrooms, hospitals, etc."
# Logo of the device
logo: am307.png
# Product name & Version
product:
    name: MILE/AM307
    version: 1
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://lora-alliance.org/wp-content/uploads/2020/10/LoRa_Alliance_Vendor_ID_for_QR_Code_02142022.pdf.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds: 
    - id: msight_RFGroup1_1.0.3a_classA
    - id: msight_RFGroup4_1.0.3a_classA
    - id: msight_us915-22dBm_1.0.3a_classA
    - id: msight_au915-22dBm_1.0.3a_classA
    - id: msight_cn470-19dBm_1.0.3a_classA

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings. 
# Maximum device TX Conducted output power in dBm. 
maxTxPower:
# Minimum device TX Conducted output power in dBm. 
minTxPower:
# Maximum device TX Radiated output power in dBm.  
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.  
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'  
# or 'random' (not known, changes over time). 
motionIndicator:

# Is your device certified by the LoRa Alliance? Possible values: true, false. 
LoRaWANCertified: true
# Always mandatory: `<vendorId>:<modelName>:<modelVersion>` (You should have only one per model)
# Format: `<8 characters max>:<16 characters max>:<digits only>`
modelId: msight:am307:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
protocolId:
  - msight:am307:1 
  - msight:am300-series:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
# DataSheet URL (optional) 
specificationURL: https://resource.milesight-iot.com/milesight/document/am300-series-datasheet-en.pdf
# User Guide URL (optional) 
userGuideURL: 
# Available sensors following Actility ontology: https://github.com/actility/thingpark-iot-flow-js-driver/blob/master/UNITS.md 
sensors: 
  - batteryLevel:%
  - temperature:Cel
  - humidity:%RH
# Driver examples
# A list of examples description that are compatible with this model
examples:
  msight:am307:1:
    - "Downlink encode: time_sync_enable"
    - "Uplink example for AM307"
    - "Downlink encode: report_interval"
    - "BACnet example"
    - "Uplink coverage: child_lock_settings:off_button, child_lock_settings:on_button, child_lock_settings:collection_button"
    - "Uplink coverage: co2_calibration_settings:mode, co2_calibration_settings:calibration_value, light_level"
    - "Uplink coverage: co2"
    - "Uplink coverage: tvoc"
    - "Uplink coverage: pressure"
    - "Uplink coverage: report_interval"
    - "Uplink coverage: time_zone"
    - "Uplink coverage: retransmit_interval"
    - "Uplink coverage: stop_transmit"
    - "Uplink coverage: ipso_version"
    - "Uplink coverage: hardware_version"
    - "Uplink coverage: firmware_version"
    - "Uplink coverage: sn"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage: reboot, stop_buzzer, query_status and 13 more"
    - "Uplink coverage: resend_interval"
    - "Uplink coverage: screen_display_element_settings:temperature"
    - "Uplink coverage (synthetic frame): device_status, lorawan_class, co2_abc_calibration_enable and 6 more"
    - "Downlink encode: linked group screen_display_element_settings (7 points)"
    - "Downlink encode: linked group child_lock_settings (3 points)"
    - "Downlink write: reboot"
    - "Downlink write: stop_buzzer"
    - "Downlink write: query_status"
    - "Downlink write: report_interval"
    - "Downlink write: co2_abc_calibration_enable"
    - "Downlink write: co2_calibration_enable"
    - "Downlink write: buzzer_enable"
    - "Downlink write: screen_display_enable"
    - "Downlink write: screen_display_alarm_enable"
    - "Downlink write: retransmit_enable and 3 more"
    - "Downlink write: stop_transmit"
    - "Downlink write: clear_history"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false