# Commercial name of the model
name: GS301 - Bathroom Odor Detector
# Functional description of the product. Maximum 500 characters.
description: "GS301 can be applied to measure the concentration of harmful gases such as ammonia and hydrogen sulfide in real-time."
# Logo of the device
logo: gs301.png
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://lora-alliance.org/wp-content/uploads/2020/10/LoRa_Alliance_Vendor_ID_for_QR_Code_02142022.pdf.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds:
  - id: msight_RFGroup1_1.0.3a_classA
  - id: msight_RFGroup4_1.0.3a_classA
  - id: msight_us915-22dBm_1.0.3a_classA
  - id: msight_cn470-19dBm_1.0.3a_classA
  - id: msight_au915-22dBm_1.0.3a_classA

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings.
# Maximum device TX Conducted output power in dBm.
maxTxPower:
# Minimum device TX Conducted output power in dBm.
minTxPower:
# Maximum device TX Radiated output power in dBm.
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'
# or 'random' (not known, changes over time).
motionIndicator:

# Is your device certified by the LoRa Alliance? Possible values: true, false.
LoRaWANCertified: false
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a model, it cannot be changed later
modelId: msight:gs301:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a protocolId, it cannot be changed later
protocolId:
  - msight:gs301:2
  - msight:gs301:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
# DataSheet URL (optional)
specificationURL: https://resource.milesight.com/milesight/iot/document/gs301-datasheet-en.pdf
# User Guide URL (optional)
userGuideURL: https://resource.milesight.com/milesight/iot/document/gs301-user-guide-en.pdf
# <sensor>:<unitId> Available sensors following Actility ontology: https://github.com/actility/device-catalog/blob/main/template/sample-vendor/drivers/ONTOLOGY.md
sensors:
  - batteryLevel:%
  - temperature:Cel
  - humidity:%RH
  - concentration:ppm
# Driver examples
# A list of examples description that are compatible with this model
examples: 
  msight:gs301:2:
    - "Example 1"
    - "Downlink encode: report_interval"
    - "Downlink encode: led_indicator_enable"
    - "Uplink coverage: nh3_calibration_settings:mode, nh3_calibration_settings:calibration_value"
    - "Uplink coverage: h2s_calibration_settings:mode, h2s_calibration_settings:calibration_value"
    - "Uplink coverage: nh3_sensor_status, h2s_sensor_status, report_interval"
    - "Uplink coverage: threshold_report_interval"
    - "Uplink coverage: ipso_version"
    - "Uplink coverage: hardware_version"
    - "Uplink coverage: firmware_version"
    - "Uplink coverage: device_status"
    - "Uplink coverage: sn"
    - "Uplink coverage: sensor_id"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage (synthetic frame): led_indicator_enable, buzzer_enable, lorawan_class and 6 more"
    - "Downlink encode: linked group nh3_calibration_settings (2 points)"
    - "Downlink encode: linked group h2s_calibration_settings (2 points)"
    - "Downlink encode: linked group alarm_config (7 points)"
    - "Downlink write: report_interval and 2 more"
    - "Uplink coverage: reboot, query_life_remain"
  msight:gs301:1:
    - "Downlink encode: led_indicator_enable"
    - "Example 1"
    - "Downlink encode: report_interval"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false