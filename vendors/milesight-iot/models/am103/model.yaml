# Commercial name of the model
name: AM103 - 3-in-1 Indoor Air Quality Sensor
# Functional description of the product. Maximum 500 characters.
description: "Milesight AM103 is an indoor air quality sensor measuring temperature, humidity, and CO2, with a built-in E-ink display and NFC-assisted installation."
# Logo of the device
logo: am103.png
# Product name & Version
product:
    name: MILE/AM103
    version: 1
deviceProfileIds:
  - id: msight_RFGroup1_1.0.3a_classA
  - id: msight_RFGroup4_1.0.3a_classA
  - id: msight_us915-22dBm_1.0.3a_classA
  - id: msight_au915-22dBm_1.0.3a_classA
  - id: msight_cn470-19dBm_1.0.3a_classA
maxTxPower:
minTxPower:
maxTxEIRP:
minTxEIRP:
motionIndicator:
LoRaWANCertified: true
modelId: msight:am103:1
protocolId:
  - msight:am103:1
  - msight:am100-series:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
specificationURL: https://www.milesight.com/iot/product/lorawan-sensor/am103-am103l
userGuideURL: https://resource.milesight.com/milesight/iot/document/am102(l)-and-am103(l)-user-guide-en.pdf
sensors:
  - batteryLevel:%
  - temperature:Cel
  - humidity:%RH
  - co2Level:ppm
examples:
  msight:am100-series:1:
    - "Example am103am103l"
    - "Example am104"
    - "Example am107"
  msight:am103:1:
    - "Downlink encode: time_sync_enable"
    - "Uplink example for AM103"
    - "Downlink encode: report_interval"
    - "BACnet example"
    - "Synthetic downlink regression: BACnet provisioning screen_display_element_settings"
    - "Synthetic downlink regression: BACnet provisioning temperature_alarm_config"
    - "Synthetic downlink regression: BACnet provisioning co2_alarm_config"
    - "Synthetic downlink regression: BACnet provisioning co2_abc_calibration_settings"
    - "Synthetic downlink regression: BACnet provisioning altitude_calibration_settings"
    - "Synthetic downlink regression: BACnet provisioning hibernate_config"
    - "Synthetic downlink regression: BACnet provisioning time_zone"
    - "Synthetic downlink regression: BACnet provisioning led_indicator_mode 0"
    - "Synthetic downlink regression: BACnet provisioning led_indicator_mode 2"
    - "Uplink coverage: hibernate_config:enable, hibernate_config:lora_uplink_enable, hibernate_config:start_time and 15 more"
    - "Uplink coverage: sensor_enable:temperature, sensor_enable:humidity, sensor_enable:co2"
    - "Uplink coverage: co2_abc_calibration_settings:enable, co2_abc_calibration_settings:period, co2_abc_calibration_settings:calibration_value"
    - "Uplink coverage: co2_alarm_config:enable, co2_alarm_config:threshold_1, co2_alarm_config:threshold_2"
    - "Uplink coverage: retransmit_enable, retransmit_interval, resend_interval and 2 more"
    - "Uplink coverage: co2_calibration_settings:mode, co2_calibration_settings:calibration_value, report_interval"
    - "Uplink coverage: timestamp"
    - "Uplink coverage: time_zone"
    - "Uplink coverage: screen_refresh_interval"
    - "Uplink coverage: screen_last_refresh_interval"
    - "Uplink coverage: ipso_version"
    - "Uplink coverage: hardware_version"
    - "Uplink coverage: firmware_version"
    - "Uplink coverage: device_status"
    - "Uplink coverage: sn"
    - "Uplink coverage: reset_event"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage: reboot, time_sync_enable, clear_report_schedule and 8 more"
    - "Downlink encode: linked group screen_display_element_settings (4 points)"
    - "Downlink encode: linked group temperature_alarm_config (3 points)"
    - "Downlink encode: linked group co2_alarm_config (3 points)"
    - "Downlink encode: linked group co2_abc_calibration_settings (3 points)"
