    - "Uplink coverage: celsius_target_temperature2, fahrenheit_target_temperature2, ble_configuration_settings:local_id:address and 1 more"
    - "Uplink coverage: version:firmware_version, version:hardware_version"
    - "Uplink coverage: pir_energy:plan:occupied, pir_energy:plan:unoccupied, product_sn"
    - "Uplink coverage: ble_event:type"
    - "Uplink coverage: execution_plan_id"
    - "Uplink coverage: power_bus_event:type"
    - "Uplink coverage: pir_status"
    - "Uplink coverage: temperature_alarm:type"
    - "Uplink coverage: humidity_alarm:type"
    - "Uplink coverage: key_event:type"
    - "Uplink coverage: battery_event:type"
