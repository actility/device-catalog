  msight:wt401:2:
    - "Battery, temperature, humidity and target temperature uplink"
    - "Uplink coverage: children_lock_settings:button1_event, children_lock_settings:button2_event, children_lock_settings:button3_event and 60 more"
    - "Uplink coverage: target_temperature_range:heat:celsius_max, target_temperature_range:heat:celsius_min, target_temperature_range:heat:fahrenheit_max and 24 more"
    - "Uplink coverage: target_temperature_settings:celsius_dehumidify, target_temperature_settings:fahrenheit_dehumidify, target_temperature_settings:celsius_em_heat and 18 more"
    - "Uplink coverage: reporting_interval:ble:seconds_of_time, reporting_interval:ble:unit, reporting_interval:lora:seconds_of_time and 7 more"
    - "Uplink coverage: ble_enable, data_sync_timeout, data_sync_to_peer and 17 more"
    - "Uplink coverage: pir_night:occupied, temperature_control_mode:plan_mode_enable, time_zone and 8 more"
    - "Uplink coverage: reporting_interval:lora:minutes_of_time, reporting_interval:power_lora:minutes_of_time, ble_configuration_settings:local_name_last and 1 more"
    - "Uplink coverage: ble_name"
    - "Downlink encode: linked group collection_interval (3 points)"
    - "Downlink encode: linked group communicate_interval (12 points)"
    - "Downlink encode: linked group daylight_saving_time (2 points)"
    - "Downlink encode: linked group humidity_calibration_settings (2 points)"
    - "Downlink encode: linked group pir_common (5 points)"
    - "Downlink encode: linked group pir_energy (3 points)"
    - "Downlink encode: linked group pir_night (7 points)"
    - "Downlink encode: linked group reporting_interval (12 points)"
