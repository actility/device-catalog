    - "Downlink encode: linked group unlock_button (2 points)"
    - "Downlink write: backlight_enable and 4 more"
    - "Downlink write: device_status and 4 more"
    - "Downlink write: origin_temperature and 4 more"
    - "Downlink write: screen_temp_mode_enable and 4 more"
    - "Downlink write: time_zone"
