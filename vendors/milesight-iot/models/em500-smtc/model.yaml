    - "Uplink coverage: device_status"
    - "Uplink coverage: sn"
    - "Uplink coverage: reset_event"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage: reboot, report_status, sync_time and 7 more"
    - "Uplink coverage (synthetic frame): lorawan_class, sensor_all_enable, sensor_temperature_enable and 6 more"
