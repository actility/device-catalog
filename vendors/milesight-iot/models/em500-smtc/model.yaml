    - "Downlink encode: report_interval"
    - "Downlink encode: sensor_all_enable"
    - "Uplink coverage: recollection_config:counts, recollection_config:interval"
    - "Uplink coverage: temperature_calibration_settings:enable, temperature_calibration_settings:calibration_value, moisture_calibration_settings:enable and 6 more"
    - "Uplink coverage: report_interval"
    - "Uplink coverage: timestamp"
