# Commercial name of the model
name: WT303 - Brand New Smart Fan Coil Thermostat
# Functional description of the product. Maximum 500 characters.
description: "The Milesight LoRaWAN® smart fan coil thermostat is compatible with both 4-pipe and 2-pipe fan coil systems, supporting 3-speed fans and EC fan control. It seamlessly integrates into intelligent control systems to enable centralized management and efficient energy consumption optimization, aiming to revolutionize HVAC management in modern buildings, hotels, shopping malls, etc."
# Logo of the device
logo: wt303.png
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://lora-alliance.org/wp-content/uploads/2020/10/LoRa_Alliance_Vendor_ID_for_QR_Code_02142022.pdf.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds:
  - id: msight_RFGroup1_1.0.3a_classC
  - id: msight_RFGroup4_1.0.3a_classC
  - id: msight_us915-22dBm_1.0.3a_classC
  - id: msight_cn470-19dBm_1.0.3a_classC
  - id: msight_au915-22dBm_1.0.3a_classC

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings.
# Maximum device TX Conducted output power in dBm.
maxTxPower:
# Minimum device TX Conducted output power in dBm.
minTxPower:
# Maximum device TX Radiated output power in dBm.
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'
# or 'random' (not known, changes over time).
motionIndicator:

# Is your device certified by the LoRa Alliance? Possible values: true, false.
LoRaWANCertified: false
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a model, it cannot be changed later
modelId: msight:wt303:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a protocolId, it cannot be changed later
protocolId:
  - msight:wt303:3
  - msight:wt303:2
  - msight:wt303:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
# DataSheet URL (optional)
specificationURL: https://resource.milesight.com/milesight/iot/document/wt303-wt304-datasheet-en.pdf
# User Guide URL (optional)
userGuideURL: https://resource.milesight.com/milesight/iot/document/wt303-wt304-user-guide-en.pdf
# <sensor>:<unitId> Available sensors following Actility ontology: https://github.com/actility/device-catalog/blob/main/template/sample-vendor/drivers/ONTOLOGY.md
sensors:
  - humidity:%RH
  - temperature:Cel
  - status:state
# Driver examples
# A list of examples description that are compatible with this model
examples: 
  msight:wt303:3:
    - "Example 1"
    - "Downlink encode: reboot"
    - "Downlink encode: d2d_master_enable"
    - "Uplink coverage: daylight_saving_time:daylight_saving_time_offset, daylight_saving_time:enable, daylight_saving_time:end_hour_min and 59 more"
    - "Uplink coverage: high_temperature_alarm_settings:celsius_difference_in_temperature, high_temperature_alarm_settings:difference_in_temperature, high_temperature_alarm_settings:duration and 22 more"
    - "Uplink coverage: interface_settings:object, interface_settings:valve_4_pipe_2_wire:cooling, interface_settings:valve_4_pipe_2_wire:heating"
    - "Uplink coverage: celsius_cooling_target_temperature, cooling_target_temperature, fahrenheit_cooling_target_temperature and 25 more"
    - "Uplink coverage (synthetic frame): temperature_source:type, temperature_unit, window_opening_detection_enable and 8 more"
    - "Downlink encode: linked group cooling_target_temperature_range (2 points)"
    - "Downlink encode: linked group fan_auto_mode_temperature_range (2 points)"
    - "Downlink encode: linked group heating_target_temperature_range (2 points)"
    - "Downlink encode: linked group high_temperature_alarm_settings (2 points)"
    - "Downlink encode: linked group low_temperature_alarm_settings (2 points)"
    - "Downlink encode: linked group target_humidity_range (2 points)"
    - "Downlink encode: linked group temperature_alarm_settings (2 points)"
    - "Downlink write: celsius_heating_target_temperature and 2 more"
    - "Downlink write: celsius_cooling_target_temperature"
    - "Downlink write: cooling_target_temperature"
    - "Downlink write: di_enable and 4 more"
    - "Downlink write: heating_target_temperature and 4 more"
    - "Downlink write: reconnect and 4 more"
    - "Downlink write: target_temperature_resolution and 4 more"
    - "Downlink write: window_opening_detection_enable"
    - "Downlink encode: daylight_saving_time:daylight_saving_time_offset and 4 more"
    - "Downlink encode: insert_schedule:type and 4 more"
    - "Downlink encode: temperature_control_dehumidification:temperature_tolerance and 4 more"
    - "Uplink coverage: send_temperature:temperature, send_temperature:fahrenheit_temperature, send_temperature:celsius_temperature and 9 more"
    - "Uplink coverage: relay_status:high_status, relay_status:low_status, relay_status:mid_status and 3 more"
    - "Uplink coverage: interface_settings:valve_2_pipe_3_wire:nc, interface_settings:valve_2_pipe_3_wire:no, version:firmware_version and 1 more"
    - "Uplink coverage: temperature_source:lorawan_reception:timeout, temperature_source:lorawan_reception:timeout_response, device_status and 1 more"
    - "Uplink coverage: temperature_source:d2d_reception:timeout, temperature_source:d2d_reception:timeout_response, tsl_version"
    - "Uplink coverage: humidity_alarm:type"
    - "Uplink coverage: target_temperature_alarm:type"
    - "Uplink coverage: interface_settings:valve_2_pipe_2_wire:control, di_settings:magnet_detection:magnet_type, window_opening_detection_settings:magnet_detection:duration"
  msight:wt303:2:
    - "Example 1"
    - "Downlink encode: reboot"
    - "Downlink encode: d2d_master_enable"
  msight:wt303:1:
    - "Downlink encode: d2d_master_enable"
    - "Example 1"
    - "Downlink encode: reboot"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false