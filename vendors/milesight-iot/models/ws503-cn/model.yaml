name: WS503-CN Smart Wall Switch
description: "Milesight WS503-CN smart wall switch."
logo: ws503-cn.png
deviceProfileIds:
  - id: msight_RFGroup1_1.0.3a_classC
  - id: msight_RFGroup4_1.0.3a_classC
  - id: msight_cn470-19dBm_1.0.3a_classC
LoRaWANCertified: false
modelId: msight:ws503-cn:1
protocolId:
  - msight:ws503-cn:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: true
specificationURL: https://resource.milesight.com/milesight/iot/document/ws50x-datasheet-en.pdf
userGuideURL:
sensors:
  - status:state
examples:
  msight:ws503-cn:1:
    - "Downlink encode: report_status"
    - "Uplink example for WS503-CN"
    - "Downlink encode: report_interval"
    - "BACnet example"
    - "Uplink coverage: child_lock_config:enable, child_lock_config:lock_time"
    - "Uplink coverage: time_zone"
    - "Uplink coverage: report_interval"
    - "Uplink coverage: ipso_version"
    - "Uplink coverage: hardware_version"
    - "Uplink coverage: firmware_version"
    - "Uplink coverage: device_status"
    - "Uplink coverage: sn"
    - "Uplink coverage: reset_event"
    - "Uplink coverage: tsl_version"
    - "Uplink coverage: reboot, report_attribute, led_mode and 4 more"
    - "Downlink encode: linked group delay_task (2 points)"
    - "Downlink write: reboot"
    - "Downlink write: report_attribute"
    - "Downlink write: cancel_delay_task"
    - "Downlink write: reset_button_enable"
    - "Downlink write: sync_time"
    - "Uplink coverage: frame_count, delay_time"
