# Formal driver name
name: TCT e-green sensor codec
# Simple description of the driver functionalities
description: "Decoder for the TCT e-green sensor (ATIM ACW/LW8-CTS and ACW/LW8-CS) uplinks: current, supercapacitor voltage and thermocouple temperature measurements with history, threshold alerts, error frames and configuration acknowledgments."
# Mandatory - id of the company that developed the driver
producerId: actility
# Email of the developer
developerEmail: tpx-iot-flow@actility.com
# Needed for linking the model with a specific driver -> must be the same one used in model.yaml
protocolId: tct:e-green-sensor:1
# This is to specify the type of functions signature used in this driver.
signature: lora-alliance
packageName: tct-e-green-sensor
packageVersion: 1.0.0
