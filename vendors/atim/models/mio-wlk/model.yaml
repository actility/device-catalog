    - "4-20 mA current on input 1"
    - "Historised current and voltage, 2 samples"
    - "Internal sensor temperature and humidity"
    - "Digital inputs and counter of input 1"
    - "Input 1 change of state"
    - "Percentage on input 1"
    - "Extended measurement frame (LTE-M / NB-IoT)"
    - "Timestamped extended measurement frame, history of 2 samples"
    - "Alert: high threshold exceeded, current of input 1"
    - "End of alert: voltage of input 2 back within the thresholds"
    - "WLK: detection cable voltage, temperature and humidity"
    - "WLK: leak detected (cable voltage above the high threshold)"
    - "WLK: end of leak alert"
    - "Cable cut detected"
    - "Cable restored"
    - "Keep alive frame"
    - "Keep alive frame with GPS position (LTE-M / NB-IoT)"
    - "Configuration accepted"
    - "Input configuration read-back"
    - "Downlink error: unknown parameter"
    - "Second analog input: current and percentage"
    - "External temperature and humidity (channel 1)"
    - "Counters 2 to 4"
    - "Error frame: EEPROM is corrupted"
    - "Set the keep alive period to once a day"
    - "Set the datalogging period to 300 minutes"
    - "Enable the timestamp in uplinks"
    - "Set input 1 to 4-20 mA"
    - "Set input 3 to 0-10 V"
    - "Set input 2 to digital input, pull-up, rising and falling edges"
