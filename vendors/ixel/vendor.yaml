# Simple description of the vendor. Maximum 500 characters. Special characters are not allowed ('\n', '\t', '\r', ect...).
description: IXEL was a French maker of TIC (Tele-Information Client) gateways for electricity meters, including the LoRaTIC LoRaWAN gateway. The company ceased trading in November 2024.

# LoRa-Alliance Vendor ID used for QR code https://read.uberflip.com/i/1507778-lora-alliance-vendor-id-apr2026/. It consists of 4 upper-case hexadecimal characters.
