# Commercial name of the model
name: PS-3
# Functional description of the product. Maximum 500 characters.
description: Battery-powered gauge pressure sensor for gases and liquids, with a detachable external probe (10 or 20 bar, other ranges available). Each uplink carries six consecutive pressure values, single readings or averages; reports per day (1 to 120) and measurements per value are set by downlink. Sigfox or LoRaWAN, selected by a hardware jumper. The probe range is not transmitted, so set it in the device setup (pressureRange in bar) to get the pressure in mbar.
# Logo of the device
logo: ps3.png

# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://read.uberflip.com/i/1507778-lora-alliance-vendor-id-apr2026/.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds:
  - id: iota_RFGroup1_1.0.4a_classA
    lorawanDeviceProfileID: ''

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings.
# Maximum device TX Conducted output power in dBm.
maxTxPower:
# Minimum device TX Conducted output power in dBm.
minTxPower:
# Maximum device TX Radiated output power in dBm.
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'
# or 'random' (not known, changes over time).
motionIndicator: near_static

# Is your device certified by the LoRa Alliance? Possible values: true, false.
LoRaWANCertified: false
# Always mandatory: `<vendorId>:<modelName>:<modelVersion>` (You should have only one per model)
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a model, it cannot be changed later
modelId: iota:ps3:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Be careful: Once you chose a protocolId, it cannot be changed later
protocolId:
  - iota:ps3:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
# DataSheet URL (optional)
specificationURL:
# User Guide URL (optional)
userGuideURL:

# <sensor>:<unitId> Available sensors following Actility ontology: https://github.com/actility/device-catalog/blob/main/template/sample-vendor/drivers/ONTOLOGY.md
sensors:
  - pressure:mbar
  - batteryLevel:%

# A list of examples description that are compatible with this model
examples:
  iota:ps3:1:
    - measurement uplink, probe range not set (raw counts only)
    - measurement uplink, 10 bar probe (5 mbar/count), one value with the probe disconnected
    - measurement uplink, 20 bar probe (10 mbar/count), 48 reports per day
    - measurement uplink, scale set directly (2 mbar/count)
    - "power-on uplink, 10 bar probe: pressure, battery above 90 %, firmware 1D600C, 24 reports per day and 1 measurement per value"
    - "daily system uplink: battery above 80 %, firmware 1D600C, 24 reports per day and 1 measurement per value"
    - "daily system uplink: battery above 10 %, 48 reports per day and 2 measurements per value"
    - daily system uplink with an undocumented battery code
    - fail decode uplink wrong FPort
    - fail decode uplink unsupported length
    - encode configuration 48 reports per day and 2 measurements per value
    - encode configuration 24 reports per day and 1 measurement per value (factory default)
    - fail encode downlink unsupported reports per day
    - fail encode downlink unsupported measurements per value
    - decode configuration downlink 48 reports per day and 2 measurements per value

LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false
