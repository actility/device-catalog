# Formal driver name
name: DC Series Driver
# Simple description of the driver functionalities
description: "Decoder for Theta Sensors DC series corrosion sensor uplinks: system info, heartbeat, events, sensor data (thickness, temperatures, corrosion rates, time of flight, ultrasonic signal strength and quality), fragmented data and command responses. Fragmented data uplinks carry pieces of the ultrasonic A-scan waveform and no measurement: the application reassembles and decodes the waveform."
# Mandatory - id of the company that developed the driver
# This id will be used to construct the id of the driver (Should be in lowercase, no special characters, maximum 8 characters)
producerId: theta
# Email of the developer
developerEmail: support@thetasensors.com
# In case of a driver per model: `<vendorId>:<modelName>:<modelVersion>`
# In case of a driver for multiples model: `<vendorId>:generic:<genericVersion>`
# Format: `<8 characters max>:<16 characters max>:<digits only>`
# Needed for linking the model with a specific driver -> must be the same one used in model.yaml in the corresponding model
# You should have only one protocolId per driver
protocolId: theta:dc-series:1
# This is to specify the type of functions signature used in this driver. Possible values: actility, lora-alliance, ttn, chirpstack.
# Keep it empty if you followed the lora-alliance payload codec api
signature: lora-alliance
packageName: theta-dc-series
# Overall package version (packaging/build changes included), not just the manufacturer's codec version
packageVersion: 1.0.0
# Optional, managed by Actility only after security code review.
# If present and valid, it marks the driver as trusted and allows execution outside sandbox.
# trustedCRC: 01234567
