name: nke-watteco ino-sensor driver
description: The nke WATTECO In’O includes optocoupled 10 inputs and 4 outputs. It turns any type of I/O sensor/actuator into a Class A or Class C sensor/actuator and connects to a public or private LoRaWAN® network.
