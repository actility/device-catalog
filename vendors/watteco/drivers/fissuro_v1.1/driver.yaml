# Formal driver name
name: fissur'o driver
# Simple description of the driver functionalities
description: Decoder for fissur'o
# Mandatory - id of the company that developed the driver
producerId: watteco
# Email of the developer
developerEmail: mpouillot@watteco.fr
# In case of a driver per model: `<vendorId>:<modelName>:<modelVersion>`
# Needed for linking the model with a specific driver
protocolId: watteco:fissuro:5
# Possible values: actility, lora-alliance, ttn, chirpstack.
# Empty because the driver follows the LoRa Alliance payload codec API.
signature: lora-alliance
packageName: fissuro_v5
# Overall package version (packaging/build changes included)
packageVersion: 1.0.0
# Version of the manufacturer's codec specification
manufacturerSpecVersion: 1.0.0
# Version of the manufacturer's decoder implementation
manufacturerImplVersion: 1.0.1
