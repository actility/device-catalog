name: nke-watteco vaqao-sensor driver
description: The nke WATTECO Vaqa’O sensor is a LoRaWAN® device that measures the temperature, relative humidity, concentration of volatile organic compounds (VOC), and carbon dioxide (CO2) in the ambient air of a room, in a building, an apartment, or a house. It allows Indoor Air Quality (IAQ) monitoring.
