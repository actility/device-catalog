name: SIGN+
description: "Connected 7-in-1 indoor air quality sensor with E-ink display. SIGN+ measures temperature, humidity, CO2, VOC, presence, luminosity and noise. Up to 20 years battery life."
logo: sign-plus.png
deviceProfileIds:
    - id: nexelec_G1_1.0.4-RP2-1.0.3_classA
maxTxPower:
minTxPower:
maxTxEIRP:
minTxEIRP:
motionIndicator: near_static
LoRaWANCertified: false
modelId: nexelec:sign-plus:1
protocolId: nexelec:x2:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
specificationURL: https://support.nexelec.fr/fr/support/solutions/articles/80001156722-datasheet-sign-
userGuideURL:
sensors:
- co2Level:ppm
- humidity:%RH
- illuminance:lx
- occupancyLevel:%
- sound:dB
- temperature:Cel
examples:
  nexelec:x2:1:
    - "SIGN+ Periodic Data"
    - "SIGN+ Product Status"
    - "SIGN+ Product Configuration"
    - "SIGN+ Product Screen Configuration"
