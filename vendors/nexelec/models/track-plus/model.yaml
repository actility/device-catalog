name: TRACK+
description: "Outdoor air quality monitoring station. TRACK+ measures fine particles (PM0.5/PM1/PM2.5/PM5/PM10), temperature, humidity and atmospheric pressure with integrated GPS. LoRaWAN and LTE 4G connectivity. Solar, AC or battery powered."
logo: track-plus.png
deviceProfileIds:
    - id: nexelec_G1_1.0.4-RP2-1.0.3_classA
maxTxPower:
minTxPower:
maxTxEIRP:
minTxEIRP:
motionIndicator: near_static
LoRaWANCertified: false
modelId: nexelec:track-plus:1
protocolId: nexelec:track-plus:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
specificationURL: https://support.nexelec.fr/fr/support/solutions/articles/80001170202-fiche-technique-track-
userGuideURL:
sensors:
- concentration:ug/m3
- humidity:%RH
- pressure:hPa
- temperature:Cel
examples:
  nexelec:track-plus:1:
    - "TRACK+ Periodic Data"
    - "TRACK+ Product Status"
    - "TRACK+ Positioning Frame"
    - "TRACK+ Product Configuration"
