name: FLOW CORE
description: "Connected thermostatic radiator valve head. FLOW CORE regulates the room temperature on its own sensor or on a paired NODE One remote probe, with comfort, eco, away and frost protection setpoints, weekly heating schedules and open window detection. Powered by 2 AA lithium batteries, supplied with a standard base."
logo: flow-core.png
deviceProfileIds:
    - id: nexelec_G1_1.0.4-RP2-1.0.4_classA
maxTxPower:
minTxPower:
maxTxEIRP:
minTxEIRP:
motionIndicator: near_static
LoRaWANCertified: false
modelId: nexelec:flow-core:1
protocolId: nexelec:flow:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
specificationURL:
userGuideURL:
sensors:
- batteryVoltage:mV
- percentage:%
- rssi:dBm
- status:state
- temperature:Cel
