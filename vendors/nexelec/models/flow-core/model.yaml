    - "FLOW NODE One status — FLOW CORE with a paired NODE One probe, good radio link"
    - "FLOW Configuration v0 — FLOW CORE, older firmware, sent at start-up"
    - "FLOW Configuration v2 — FLOW CORE, weekly periodic resend, BOOST 30 min"
    - "FLOW encode downlink: set child lock"
