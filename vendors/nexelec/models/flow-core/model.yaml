    - "FLOW encode downlink: set target temperature 19.5 °C"
    - "FLOW encode downlink: set minimum and maximum temperatures"
    - "FLOW encode downlink: set temperature offset -1.5 °C"
    - "FLOW encode downlink: set open window detection"
