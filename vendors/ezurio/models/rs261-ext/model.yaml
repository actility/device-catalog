# Commercial name of the model
name: Sentrius RS261 External Temperature Sensor
# Functional description of the product. Maximum 500 characters.
description: "Ezurio (formerly Laird Connectivity) Sentrius RS261-EXT: battery-powered IP67 LoRaWAN / Bluetooth LE temperature sensor with a USB-C external probe (thermistor, -40 to 125 °C; RTD probes supported by recent firmware). RS261 variant with RM1261 module for Europe / UK (EU868, part 450-00041-K1). Reports periodic, aggregated and backlogged readings; configurable by downlink. Class A, LoRaWAN 1.0.4."
# Logo of the device
logo: ezurio-sentrius-rs261-ext.png
# Product name & Version
product:
    name: Ezurio/RS261-EXT
    version: 1
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
# id: as defined under /profiles.
# lorawanDeviceProfileID: as defined by LoRa Alliance in https://lora-alliance.org/wp-content/uploads/2020/10/LoRa_Alliance_Vendor_ID_for_QR_Code_02142022.pdf.
# The lorawanDeviceProfileID consists of 8 upper-case hexadecimal characters, 4 characters for VendorID + 4 characters for VendorProfileID. Please consider using single (') or double (") quotation.
deviceProfileIds:
    - id: ezurio_RFGroup1_1.0.4_classA

# You may optionally customize any of the following settings to override the generic value set in LoRaWAN device profiles associated with your model. Leave empty if you want to keep the Device Profile settings.
# Maximum device TX Conducted output power in dBm.
maxTxPower:
# Minimum device TX Conducted output power in dBm.
minTxPower:
# Maximum device TX Radiated output power in dBm.
maxTxEIRP:
# Minimum device TX Radiated output power in dBm.
minTxEIRP:
# Typical mobility profile of the device. Possible values are 'near_static' (also valid for static devices), 'walking_speed', 'vehicular_speed'
# or 'random' (not known, changes over time).
motionIndicator:

# Is your device certified by the LoRa Alliance? Possible values: true, false.
LoRaWANCertified: false
# Format: `<8 characters max>:<16 characters max>:<digits only>`
modelId: ezurio:rs261-ext:1
# <vendorId>:<protocolName>:<protocolVersion> Needed for linking the model with a specific driver -> must be the same one used in driver.yaml in the corresponding model (You might have several ones)
protocolId:
  - ezurio:rs26x:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
# DataSheet URL (optional)
specificationURL: https://www.ezurio.com/documentation/product-brief-rs26x-sensor
# User Guide URL (optional)
userGuideURL: https://www.ezurio.com/documentation/user-guide-rs26x-series
# <sensor>:<unitId> Available sensors following Actility ontology: https://github.com/actility/device-catalog/blob/main/template/sample-vendor/drivers/ONTOLOGY.md
sensors:
  - temperature:Cel
  - batteryVoltage:mV
  - rssi:dBm
  - snr:dB
# Driver examples
# A list of examples description that are compatible with this model
examples:
  ezurio:rs26x:1:
    - "Decode Positive 16-Bit Temperature - RS262 (external RTD probe)"
    - "Decode Negative 16-Bit Temperature - RS262 (external RTD probe)"
    - "Decode Aggregated 16-Bit Temperature - RS262 (external RTD probe)"
    - "Decode 16-Bit Temperature Backlogs - RS262 (external RTD probe)"
    - "Decode 16-Bit Temperature and Temperature Backlogs - RS262 (external RTD probe)"
    - "Decode Read Thermistor 560 Cal Actual - RS262 (external thermistor probe)"
    - "Decode Read Thermistor S-H Coefficient A - RS262 (external thermistor probe)"
    - "Decode Read Group External Thermistor - RS262 (external thermistor probe)"
    - "Downlink Encode Write Thermistor S-H Coefficient A - RS262 (external thermistor probe)"
    - "Downlink Encode Write Group External Thermistor - RS262 (external thermistor probe)"
    - "Downlink Decode Write Thermistor S-H Coefficient A - RS262 (external thermistor probe)"
    - "Downlink Encode Write Friendly Name - RS26x"
    - "Downlink Encode Write Read Period - RS26x"
    - "Downlink Encode Write Confirmed Packet Retries - RS26x"
    - "Downlink Encode Write RTC Time - RS26x"
    - "Downlink Encode Write AU Region - RS26x"
    - "Downlink Encode Write Clear Backlog - RS26x"
    - "Downlink Encode Write Group Internal Temperature - RS26x"
    - "Downlink Encode Read Friendly Name - RS26x"
    - "Downlink Encode Read Read Period - RS26x"
    - "Downlink Encode Read Confirmed Packet Retries - RS26x"
    - "Downlink Encode Read RTC Time - RS26x"
    - "Downlink Encode Read AU Region - RS26x"
    - "Downlink Encode Read Group Internal Temperature - RS26x"
    - "Downlink Decode Write Friendly Name - RS26x"
    - "Downlink Decode Write Read Period - RS26x"
    - "Downlink Decode Write Confirmed Packet Retries - RS26x"
    - "Downlink Decode Write RTC Time - RS26x"
    - "Downlink Decode Write AU Region - RS26x"
    - "Downlink Decode Write Clear Backlog - RS26x"
    - "Downlink Decode Write Group Internal Temperature - RS26x"
    - "Downlink Decode Read Friendly Name - RS26x"
    - "Downlink Decode Read Read Period - RS26x"
    - "Downlink Decode Read Confirmed Packet Retries - RS26x"
    - "Downlink Decode Read RTC Time - RS26x"
    - "Downlink Decode Read AU Region - RS26x"
    - "Downlink Decode Read Group Internal Temperature - RS26x"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false
