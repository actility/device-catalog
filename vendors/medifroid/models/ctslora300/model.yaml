# Commercial name of the model
name: CTSLORA300
# Functional description of the product. Maximum 500 characters.
description: "Medifroid CTSLORA300 LoRaWAN cold chain temperature logger. Designed for monitoring temperatures in refrigerated storage, transport and pharmaceutical environments."
# Logo of the device
logo: ctslora300.png
# Product name & Version
product:
    name: MEDF/CTS300
    version: 1
# ID(s) of the profile that defines the LoRaWAN characteristics of this model.
deviceProfileIds:
    - id: medifroid_RFGroup1_1.0.2a_classA

maxTxPower:
minTxPower:
maxTxEIRP:
minTxEIRP:
motionIndicator: near_static

LoRaWANCertified: false
modelId: medifrd:ctslora300:1
# <vendorId>:<protocolName>:<protocolVersion>
protocolId: medifrd:ctslora:1
# Informative, maintained by Netmore: true when the driver of the first protocolId above ships a
# BACnet/Modbus mapping (mapping.json, in Netmore's private catalog), so that the device can be
# exposed through the BACnet and Modbus gateways. Checked: true requires that mapping.
supportedBACnetModbus: false
# DataSheet URL (optional)
specificationURL: https://www.medifroid.fr/
# User Guide URL (optional)
userGuideURL:
sensors:
    - temperature:Cel

examples:
  medifrd:ctslora:1:
    - "TYPE_NEW_DATAS - 1 channel, 5 temperature measures"
    - "TYPE_SYNC_ASKED - synchronisation request"
LoRaWANRelay:
  canOperateAsARelay: false
  defaultRelayActivation: false
